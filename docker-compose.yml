version: '3.8'

services:
  # Database: MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: pet-health-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: pet_health
      MARIADB_USER: pet_user
      MARIADB_PASSWORD: pet_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mariadb_data:
