# ===================================================================
# Database Configuration (MariaDB)
# ===================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/pet_health?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=pet_user
spring.datasource.password=pet_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Schema Initialization Configuration (MyBatis)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

# ===================================================================
# Redis Configuration (Cache & Expiry)
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
# Allow listening to keyspace expiration events
spring.data.redis.repositories.enabled=false

# ===================================================================
# Apache Kafka Configuration
# ===================================================================
spring.kafka.bootstrap-servers=localhost:9092
# Producer Configs
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer Configs
spring.kafka.consumer.group-id=pet-health-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===================================================================
# Caffeine Cache Configuration
# ===================================================================
spring.cache.type=caffeine
# Caches configured: weightTrend (expire 10m), monthlySummary (expire 10m)
spring.cache.cache-names=weightTrend,monthlySummary
spring.cache.caffeine.spec=expireAfterWrite=10m,initialCapacity=50,maximumSize=500

# ===================================================================
# Logging & Server Config
# ===================================================================
server.port=8080
logging.level.org.springframework.web=INFO
logging.level.com.lulu.health=DEBUG
logging.level.org.hibernate.SQL=DEBUG
