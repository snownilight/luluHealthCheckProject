name: pet_health_tracker
description: A new Flutter project for tracking pet health status in real-time.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Database (Drift / SQLite)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Google OAuth & Google Sheets
  google_sign_in: ^6.1.5
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  shared_preferences: ^2.2.2

  # Networking & Real-time
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  stomp_dart_client: ^3.0.1

  # UI Components & Visualization
  fl_chart: ^0.66.0
  intl: ^0.19.0
  drift_flutter: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Noto Sans TC
      fonts:
        - asset: assets/fonts/NotoSansTC-VF.ttf
