# ===================================================================
# Database Configuration (MariaDB)
# ===================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/pet_health?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=pet_user
spring.datasource.password=pet_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Schema Initialization Configuration (MyBatis)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml

# ===================================================================
# Caffeine Cache Configuration
# ===================================================================
spring.cache.type=caffeine
# Caches configured: weightTrend (expire 10m), monthlySummary (expire 10m)
spring.cache.cache-names=weightTrend,monthlySummary
spring.cache.caffeine.spec=expireAfterWrite=10m,initialCapacity=50,maximumSize=500

# ===================================================================
# Logging & Server Config
# ===================================================================
server.port=8080
logging.level.org.springframework.web=INFO
logging.level.com.lulu.health=DEBUG
logging.level.org.hibernate.SQL=DEBUG
